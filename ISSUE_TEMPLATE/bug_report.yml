name: Bug report
description: Report something that is not working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe the problem. Do not include passwords or personal data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: environment
    attributes:
      label: Environment
      description: For example production, staging, browser or device
